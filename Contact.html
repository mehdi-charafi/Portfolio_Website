    <!-- ========== CONTACT ========== -->
    <section id="contact" class="section">
      <div class="conteneur">
        <h2>Contact</h2>
        <p class="section__intro">Une question, une proposition ? Écrivez-moi.</p>

        <form class="formulaire" action="#" method="post">
          <label for="nom">Nom</label>
          <input id="nom" name="nom" type="text" required>

          <label for="email">E-mail</label>
          <input id="email" name="email" type="text" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <button class="bouton" type="submit">Envoyer</button>
        </form>

        <ul class="reseaux">
          <li><a href="https://github.com/mehdi-charafi">GitHub</a></li>
          <li><a href="www.linkedin.com/in/mehdi-charafi">LinkedIn</a></li>
          <li><a href="mailto:mahdicharafi12@gmial.com">Email</a></li>
        </ul>
      </div>
    </section>
